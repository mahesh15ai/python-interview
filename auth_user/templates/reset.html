{% extends 'main.html' %}
{% load static %}
{% block css %}
<link rel="stylesheet" href="{% static 'css/reset.css' %}">
{% endblock %}
{% block content %}
   <div class="container">
        <div class="reset-box">
            <h2>Reset Your Password</h2>

            <!-- Wrong old password -->
            {% if wrong %}
                <p class="error">Old password is incorrect!</p>
            {% endif %}

            <!-- Show new password input -->
            {% if new_pass %}
                <form method="POST">
                    {% csrf_token %}
                    <label for="newpasw">Enter New Password:</label>
                    <input type="password" name="newpasw" id="newpasw" placeholder="New Password" required>
                    <button type="submit">Update Password</button>
                </form>
            {% else %}
                <form method="POST">
                    {% csrf_token %}
                    <label for="oldpasw">Enter Old Password:</label>
                    <input type="password" name="oldpasw" id="oldpasw" placeholder="Old Password" required>
                    <button type="submit">Verify</button>
                </form>
            {% endif %}
        </div>
    </div>
{% endblock %}
